<!doctype html>
<html lang="ru">
<head>

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="lotik-tray" viewBox="0 0 200 200">
        <path d="M52 124 L148 124 L139 176 L61 176 Z" fill="#3B6CFF"/>

        <path d="M95 162 Q100 166 105 162" fill="none" stroke="#15182B" stroke-width="3" stroke-linecap="round"/>
        <circle cx="70" cy="157" r="5" fill="#FF9A62"/>
        <circle cx="130" cy="157" r="5" fill="#FF9A62"/>
      </symbol>
    </defs>
  </svg>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="logo" href="./">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M5 22V6H19V22" fill="none" stroke="#FFC629" stroke-width="3.5" stroke-linejoin="round"/>

        </svg>
        <span>Не пищи!</span>
      </a>
    </div>
  </header>

  <main class="container not-found">
    <div>
      <svg class="lotik not-found__art" viewBox="0 0 260 200" aria-hidden="true" focusable="false">
        <rect x="0" y="178" width="260" height="14" rx="7" fill="#3A3F5C"/>
        <g fill="#FFC629"><circle cx="24" cy="185" r="3"/><circle cx="74" cy="185" r="3"/><circle cx="124" cy="185" r="3"/><circle cx="174" cy="185" r="3"/><circle cx="224" cy="185" r="3"/></g>
        <use href="#lotik-tray" x="30" y="2" width="200" height="200"/>
        <use href="#face-sleep" x="30" y="2" width="200" height="200"/>
        <text class="zzz" x="196" y="112">z</text>
        <text class="zzz zzz--2" x="212" y="86">z</text>
        <text class="zzz zzz--3" x="230" y="56">Z</text>
      </svg>
      <h1>Этот рейс отменён</h1>
      <p>Страница улетела без вас. Но Лотик знает дорогу в терминал.</p>
      <a class="btn btn--primary" href="./">Вернуться в терминал</a>
    </div>
  </main>
</body>
</html>
